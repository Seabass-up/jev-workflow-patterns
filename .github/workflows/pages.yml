name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Verify iteration receipts and controller tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          for iteration in iterations/[0-9][0-9]; do
            python3 "$iteration/evaluate.py"
            python3 -m unittest discover -s "$iteration" -p 'test_*.py' -v
          done
      - name: Verify portable question kernel
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 skills/jev-question-kernel-catalog/scripts/check_contract.py skills/jev-question-kernel-catalog/assets/contract-example.json skills/jev-question-kernel-catalog/assets/fixtures-example.json
          python3 -m unittest discover -s skills/jev-question-kernel-catalog/scripts -p 'test_*.py' -v
      - name: Verify Choice confidence, discovery measurements, and candidates
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 skills/jev-question-kernel-catalog/scripts/check_confidence.py iterations email bug-hunting human-ai discovery $(dirname */collection.json)
          python3 discovery/introduction-review/measure.py
          python3 discovery/check_candidates.py
          python3 -m unittest discover -s discovery -p 'test_*.py' -v
      - name: Verify email contracts and preserved receipts
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 email/evaluate.py
          python3 -m unittest discover -s email -p 'test_*.py' -v
      - name: Verify bug-hunting contracts and preserved screening
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 bug-hunting/evaluate.py
          python3 -m unittest discover -s bug-hunting -p 'test_*.py' -v
      - name: Verify human-AI research contracts and frozen challenges
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 human-ai/evaluate.py
          python3 -m unittest discover -s human-ai -p 'test_*.py' -v
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
          python3 -m unittest discover -s scripts/collection_pipeline -p 'test_*.py' -v
      - name: Verify pattern collections
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          for meta in */collection.json; do
            collection="$(dirname "$meta")"
            python3 "$collection/evaluate.py"
            python3 -m unittest discover -s "$collection" -p 'test_*.py' -v
          done
      - name: Verify generated catalog and collection hub
        run: |
          python3 scripts/build_catalog.py
          python3 scripts/build_collection_pages.py --hub
          git diff --exit-code -- _data/catalog_summary.json catalog/index.md collections/index.md
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Build site with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Verify required pages
        run: |
          test -f ./_site/index.html
          test -f ./_site/patterns/evidence-directed-allowlist-controller/index.html
          test -f ./_site/patterns/lineage-aware-corroboration/index.html
          test -f ./_site/patterns/dependency-dag-selective-recomputation/index.html
          python3 scripts/verify_site.py ./_site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
